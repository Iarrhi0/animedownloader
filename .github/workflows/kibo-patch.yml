name: Kibo Patch Build

on:
  workflow_dispatch:
  push:
    paths:
      - "kibo/**"
      - ".github/workflows/kibo-patch.yml"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Kibo XAPK from Release
        run: |
          mkdir -p kibo/input
          curl -fL --retry 3 "https://github.com/Iarrhi0/animedownloader/releases/download/Kibo-original/_8dbbbeb2.xapk" -o kibo/input/kibo.xapk
          test -s kibo/input/kibo.xapk
      - name: Install Android patch tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zipalign
      - name: Extract XAPK
        run: |
          mkdir -p kibo/work/original
          unzip -q kibo/input/kibo.xapk -d kibo/work/original
          cp kibo/work/original/io.kibo.clarity.apk kibo/work/io.kibo.clarity.apk
      - name: Decode
        run: apktool d -f -r kibo/work/io.kibo.clarity.apk -o kibo/work/decoded
      - name: Apply Kibo patch
        run: python3 kibo/scripts/patch_kibo.py kibo/work/decoded
      - name: Rebuild
        run: apktool b kibo/work/decoded -o kibo/work/kibo-patched-unsigned.apk
      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore kibo/work/kibo.keystore -storepass android -keypass android -alias kibo -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kibo Patched,O=Local,C=MG"
      - name: Sign patched base and all split APKs
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          mkdir -p kibo/work/signed
          zipalign -f -p 4 kibo/work/kibo-patched-unsigned.apk kibo/work/base-aligned.apk
          "$BT/apksigner" sign --ks kibo/work/kibo.keystore --ks-pass pass:android --key-pass pass:android --out kibo/work/signed/io.kibo.clarity.apk kibo/work/base-aligned.apk
          for apk in kibo/work/original/*.apk; do
            n="$(basename "$apk")"
            [ "$n" = "io.kibo.clarity.apk" ] && continue
            zipalign -f -p 4 "$apk" "kibo/work/$n.aligned"
            "$BT/apksigner" sign --ks kibo/work/kibo.keystore --ks-pass pass:android --key-pass pass:android --out "kibo/work/signed/$n" "kibo/work/$n.aligned"
          done
          "$BT/apksigner" verify --verbose kibo/work/signed/io.kibo.clarity.apk
      - name: Package installable patched XAPK
        run: |
          cp kibo/work/original/*.json kibo/work/signed/ 2>/dev/null || true
          cp kibo/work/original/*.png kibo/work/signed/ 2>/dev/null || true
          cd kibo/work/signed
          zip -q -r ../Kibo-Patched-NoAds.xapk .
      - uses: actions/upload-artifact@v4
        with:
          name: KIBO-PATCHED-XAPK
          path: kibo/work/Kibo-Patched-NoAds.xapk
