name: Universal Android ZIP Builder

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------
      # Vérifier le SDK Android déjà installé
      # ---------------------------------------
      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "sdkmanager non trouvé dans PATH"

            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERREUR : sdkmanager introuvable."
              exit 1
            fi

            SDK_DIR=$(dirname "$SDKMANAGER")
            echo "$SDK_DIR" >> "$GITHUB_PATH"
            "$SDKMANAGER" --version
          fi

      # ---------------------------------------
      # Extraire TOUS les ZIP
      # ---------------------------------------
      - name: Extract ZIP files
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-projects"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          COUNT=0

          while IFS= read -r -d '' ZIP; do
            COUNT=$((COUNT + 1))

            NAME=$(basename "$ZIP" .zip)
            DEST="$ROOT/$COUNT-$NAME"

            echo "===================================="
            echo "ZIP : $ZIP"
            echo "DESTINATION : $DEST"
            echo "===================================="

            mkdir -p "$DEST"
            unzip -q "$ZIP" -d "$DEST"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "$COUNT ZIP(s) extrait(s)."

      # ---------------------------------------
      # Détecter automatiquement Android
      # ---------------------------------------
      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-projects"

          SETTINGS=$(find "$ROOT" \
            -type f \
            \( -name "settings.gradle" \
               -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle(.kts) introuvable."
            echo ""
            echo "Contenu extrait :"
            find "$ROOT" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android détecté :"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ---------------------------------------
      # Vérifier la structure
      # ---------------------------------------
      - name: Inspect Android project
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"

          echo "=== DOSSIER ==="
          pwd

          echo "=== FICHIERS ==="
          find . -maxdepth 4 -type f | sort | head -300

      # ---------------------------------------
      # Préparer Gradle
      # ---------------------------------------
      - name: Prepare Gradle
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle Wrapper détecté."
          else
            echo "Gradle Wrapper absent."
            echo "Utilisation du Gradle installé sur GitHub."
            gradle --version
          fi

      # ---------------------------------------
      # Compiler
      # ---------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.project_dir }}"

          if [ -f gradlew ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              assembleDebug
          fi

      # ---------------------------------------
      # Trouver les APK
      # ---------------------------------------
      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.detect.outputs.project_dir }}"

          echo "=== APK générés ==="

          find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print

          COUNT=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "$COUNT APK(s) généré(s)."

      # ---------------------------------------
      # Récupérer l'APK
      # ---------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeDownloader-APK
          path: |
            ${{ steps.detect.outputs.project_dir }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
