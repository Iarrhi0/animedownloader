name: Universal Android ZIP Builder

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**.zip"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==============================
      # EXTRAIRE TOUS LES ZIP
      # ==============================
      - name: Extract all ZIP files
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/android-projects"

          COUNT=0

          while IFS= read -r -d '' ZIP; do
            COUNT=$((COUNT + 1))

            NAME="$(basename "$ZIP" .zip)"
            DEST="$RUNNER_TEMP/android-projects/$COUNT-$NAME"

            echo "================================="
            echo "ZIP trouvé : $ZIP"
            echo "Extraction : $DEST"
            echo "================================="

            mkdir -p "$DEST"
            unzip -q "$ZIP" -d "$DEST"

          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print0
          )

          if [ "$COUNT" -eq 0 ]; then
            echo "ERREUR : aucun ZIP trouvé."
            exit 1
          fi

          echo "$COUNT ZIP(s) extrait(s)."

      # ==============================
      # TROUVER AUTOMATIQUEMENT
      # LE PROJET ANDROID
      # ==============================
      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -e

          ROOT="$RUNNER_TEMP/android-projects"

          echo "Recherche du projet Android..."

          SETTINGS="$(find "$ROOT" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            BUILD="$(find "$ROOT" \
              -type f \
              \( -name "build.gradle.kts" -o -name "build.gradle" \) \
              | head -n 1)"

            if [ -z "$BUILD" ]; then
              echo "ERREUR : aucun projet Gradle Android trouvé."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD")"
          fi

          echo "Projet détecté :"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # ==============================
      # AFFICHER LA STRUCTURE
      # ==============================
      - name: Show detected project
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"
          pwd
          find . -maxdepth 3 -type f | sort | head -200

      # ==============================
      # PERMISSIONS GRADLE WRAPPER
      # ==============================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          cd "${{ steps.detect.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle Wrapper trouvé."
          else
            echo "Pas de Gradle Wrapper complet."
            echo "Le Gradle système sera utilisé."
          fi

      # ==============================
      # COMPILATION
      # ==============================
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.detect.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      # ==============================
      # RECHERCHER TOUS LES APK
      # ==============================
      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.detect.outputs.project_dir }}"

          echo "APK générés :"

          find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT="$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERREUR : aucun APK généré."
            exit 1
          fi

          echo "$APK_COUNT APK(s) trouvé(s)."

      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            ${{ steps.detect.outputs.project_dir }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
